<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="utf-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan Session | Flickpost</title>
    <meta name="description" content="Flickpost is a dynamic e-commerce solutions provider, presenting connections to 200+ countries around the world. Flickpost specializes in cross-border solutions for international shipments – whether a few grams or large parcels. Our objective is to assist e-commerce sellers and SMEs save time and reduce shipping costs, where they can send anything to anywhere affordably and hassle-free.">
    <link rel="shortcut icon" href="icons/favicon32x32-1.jpg">
    <link href="css/app.css" rel="stylesheet">
    <link href="css/themify-icons.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <link href="https://unpkg.com/tabulator-tables@4.9.3/dist/css/semantic-ui/tabulator_semantic-ui.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@4.9.3/dist/js/tabulator.js"></script>
    <script src="js/scan-session-toggle.js"></script>
    <script src="js/recheck-pending.js"></script>

    <script th:inline="javascript">
        var token = $("meta[name='_csrf']").attr("content");
        var header = $("meta[name='_csrf_header']").attr("content") || 'X-CSRF-Token';

        (function injectDuplicateResolutionSpinnerStyles() {
            if (document.getElementById('duplicate-resolution-spinner-styles')) {
                return;
            }

            var style = document.createElement('style');
            style.id = 'duplicate-resolution-spinner-styles';
            style.textContent = '' +
                '.duplicate-resolution-spinner {' +
                '  width: 28px;' +
                '  height: 28px;' +
                '  display: inline-block;' +
                '  margin-bottom: 10px;' +
                '  border: 3px solid currentColor;' +
                '  border-right-color: transparent;' +
                '  border-radius: 50%;' +
                '  box-sizing: border-box;' +
                '  animation: duplicateResolutionSpin 0.75s linear infinite;' +
                '}' +
                '@keyframes duplicateResolutionSpin {' +
                '  from { transform: rotate(0deg); }' +
                '  to { transform: rotate(360deg); }' +
                '}';
            document.head.appendChild(style);
        })();

        var searching = false;
        var tableFilters = [];
        var table = null;
        var scanSessionEventSource = null;
        var scanSessionRefreshDebounce = null;
        var pendingDuplicateTrackingNumber = null;
        var duplicateResolutionInProgress = false;

        function executeUploadReport() {
            $("body").addClass("loading");
            $('#modal-hide-thing').modal('toggle');
            $("#uploadReportForm").submit();
        }


        $(document).ready(function(){
            $(window).keydown(function(event){
                if(event.keyCode == 13) {
                    event.preventDefault();
                    return false;
                }
            });

            $('#searchButton').on('click',function(){
                $('.searchform').fadeToggle();
                if(!searching) {
                    $("#searchButton").html("<i class=\"ti ti-eraser\"></i> Reset");
                    searching = true;
                } else {
                    $("#searchButton").html("<i class=\"ti ti-search\"></i> Search");
                    $('#from_date').val("");
                    $('#to_date').val("");
                    $('#search_hub').val("");
                    $('#search-tracking_no').val("");
                    if (table) {
                        table.clearFilter();
                        table.setData();
                        syncEmptyTableState();
                    }
                    searching = false;
                }
            });

            $('#search-form').on('keyup change', 'input, select', function(){
                doPostCall();
            });

            table = new Tabulator("#packages-table", {
                index:"Tracking Number",
                resizableColumns:"header",
                pagination:"remote",
                paginationAddRow:"table",
                layout: "fitDataStretch",
                ajaxURL: "/scan-session/data",
                ajaxConfig: {
                    method: "POST",
                    headers:{
                        'X-CSRF-Token': token,
                    }
                },
                ajaxContentType:"json",
                ajaxFiltering: true,
                paginationSize: 10,
                paginationSizeSelector:[10, 25, 50, 100],
                ajaxResponse:function(url, params, response){
                    var responseData = response && response.data ? response.data : [];
                    renderLatestSummary(responseData.length > 0 ? responseData[0] : null);
                    return response;
                },
                dataLoaded:function(){
                    syncEmptyTableState();
                },
                renderComplete:function(){
                    syncEmptyTableState();
                },
                placeholder:"<div class=\"scan-session-empty-placeholder\"></div>",
                rowClick:function(e, row){
                    renderLatestSummary(row.getData());
                    if (e.target && (e.target.closest("button") || e.target.closest("a") || e.target.closest("input") || e.target.closest("textarea") || e.target.closest("select") || e.target.closest("label"))) {
                        return;
                    }
                    row.toggleSelect();
                },
                columns:[
                    {formatter:"rowSelection", titleFormatter:"rowSelection", width:60, hozAlign:"center", vertAlign:"middle", headerSort:false, frozen:true, headerTooltip:true, cellClick:function(e, cell){
                            cell.getRow().toggleSelect();
                            e.stopPropagation();
                        }},
                    {title:"Hub", field:"hub", width:90, hozAlign:"center", vertAlign:"middle", frozen:true, headerTooltip:true, formatter:function (cell) {
                        var imgName = cell.getValue();
                        return getHubImageHtml(imgName);
                    }},
                    {title:"Tracking Number", field:"code", width:180, hozAlign:"center", vertAlign:"middle", frozen:true, headerTooltip:true},
                    {title:"Shipment ID", field:"shipmentId", width:180, hozAlign:"center", vertAlign:"middle", headerTooltip:true},
                    {title:"Status", field:"status", width:140, hozAlign:"center", vertAlign:"middle", headerTooltip:true, formatter:statusTextFormatter},
                    {title:"Audited Length (cm)", field:"L", width:150, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Audited Width (cm)", field:"W", width:150, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Audited Height (cm)", field:"H", width:150, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Audited Actual Weight (kg)", field:"weight", width:170, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Declared Length (cm)", field:"declaredLength", width:160, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Declared Width (cm)", field:"declaredWidth", width:160, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Declared Height (cm)", field:"declaredHeight", width:160, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Declared Actual Weight (kg)", field:"declaredActualWeight", width:180, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Declared Chargeable Weight (kg)", field:"declaredChargeableWeight", width:210, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{precision:1, thousand:""}, headerTooltip:true},
                    {title:"Declared Volumetric Weight (kg)", field:"declaredVolumetricWeight", width:210, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Client Paid Weight (kg)", field:"clientPaidWeight", width:180, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Destination Country", field:"destinationCountry", width:180, hozAlign:"center", vertAlign:"middle", headerTooltip:true},
                    {title:"Service Provider", field:"serviceProviderName", width:170, hozAlign:"center", vertAlign:"middle", headerTooltip:true},
                    {title:"Conditions", field:"itemCondition", width:170, hozAlign:"center", vertAlign:"middle", formatter:conditionsFormatter, headerTooltip:true},
                    {title:"Shipping Mode", field:"shippingMode", width:150, hozAlign:"center", vertAlign:"middle", headerTooltip:true},
                    {title:"Audited Volumetric Weight (kg)", field:"audited_volumetric_weight", width:190, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}, headerTooltip:true},
                    {title:"Audited Chargeable Weight (kg)", field:"audited_chargeable_weight", width:200, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{precision:1, thousand:""}, headerTooltip:true},
                    {title:"Date and Time", field:"time", width:180, hozAlign:"center", vertAlign:"middle", headerTooltip:true},
                    {title:"Remarks", field:"hid", width:180, hozAlign:"center", vertAlign:"middle", headerTooltip:true}
                ]
            });

            table.redraw(true);

            function syncEmptyTableState() {
                var emptyRow = document.getElementById("scan-session-empty-row");
                if (!emptyRow || !table) {
                    return;
                }
                emptyRow.style.display = table.getDataCount("active") === 0 ? "block" : "none";
            }

            syncEmptyTableState();
            renderLatestSummary(null);
            initializeScanSessionEventStream();
            window.addEventListener('beforeunload', closeScanSessionEventStream);
        });

        function debounceScanSessionRefresh() {
            if (scanSessionRefreshDebounce) {
                clearTimeout(scanSessionRefreshDebounce);
            }
            scanSessionRefreshDebounce = setTimeout(function() {
                console.log('[scan-session-sse] refreshing table + status');
                if (table) {
                    table.setData();
                }
                refreshScanSessionStatus().then(function(status) {
                    if (status && status.active) {
                        ensureScanSessionEventStream();
                    } else {
                        closeScanSessionEventStream();
                    }
                });
            }, 300);
        }

        function closeScanSessionEventStream() {
            if (scanSessionEventSource) {
                console.log('[scan-session-sse] closing stream');
                scanSessionEventSource.close();
                scanSessionEventSource = null;
            }
        }

        function refreshScanSessionStatus() {
            return fetch('/scan-session/session/status', {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'Accept': 'application/json'
                }
            }).then(function(response) {
                if (!response.ok) {
                    throw new Error('Unable to refresh scan session status');
                }
                return response.json();
            }).catch(function(error) {
                console.error('[scan-session-sse] status refresh failed', error);
                return null;
            });
        }

        function ensureScanSessionEventStream() {
            if (scanSessionEventSource) {
                return;
            }

            console.log('[scan-session-sse] opening stream');
            scanSessionEventSource = new EventSource('/scan-session/session/stream');

            scanSessionEventSource.addEventListener('connected', function(event) {
                console.log('[scan-session-sse] connected', event.data);
            });

            scanSessionEventSource.addEventListener('package-ingested', function(event) {
                console.log('[scan-session-sse] package-ingested', event.data);
                debounceScanSessionRefresh();
            });

            scanSessionEventSource.addEventListener('duplicate-detected', function(event) {
                console.log('[scan-session-sse] duplicate-detected', event.data);
                try {
                    var payload = JSON.parse(event.data);
                    if (payload && payload.trackingNumber) {
                        openDuplicateResolutionModal(payload.trackingNumber);
                    }
                } catch (error) {
                    console.error('[scan-session-sse] failed to parse duplicate event', error);
                }
            });

            scanSessionEventSource.addEventListener('session-stopped', function(event) {
                console.log('[scan-session-sse] session-stopped', event.data);
                closeScanSessionEventStream();
                debounceScanSessionRefresh();
            });

            scanSessionEventSource.onerror = function(event) {
                console.warn('[scan-session-sse] stream error', event);
                closeScanSessionEventStream();
                setTimeout(function() {
                    refreshScanSessionStatus().then(function(status) {
                        if (status && status.active) {
                            ensureScanSessionEventStream();
                        }
                    });
                }, 1000);
            };
        }

        function initializeScanSessionEventStream() {
            refreshScanSessionStatus().then(function(status) {
                console.log('[scan-session-sse] initial status', status);
                if (status && status.active) {
                    ensureScanSessionEventStream();
                } else {
                    closeScanSessionEventStream();
                }
            });
        }

        function getDuplicateFieldDefinitions() {
            return [
                [{ keys: ['trackingNumber', 'code'], label: 'Tracking Number' }],
                [{ keys: ['status'], label: 'Status' }],
                [{ keys: ['hub'], label: 'Hub' }],
                [{ keys: ['shipmentId'], label: 'Shipment ID' }],
                [{ keys: ['shippingMode'], label: 'Shipping Mode' }],
                [{ keys: ['destinationCountry'], label: 'Destination Country' }],
                [{ keys: ['serviceProviderName'], label: 'Service Provider' }],
                [{ keys: ['declaredActualWeight'], label: 'Declared Actual Weight' }],
                [{ keys: ['declaredChargeableWeight'], label: 'Declared Chargeable Weight' }],
                [{ keys: ['declaredVolumetricWeight'], label: 'Declared Volumetric Weight' }],
                [{ keys: ['auditedActualWeight', 'weight'], label: 'Audited Actual Weight' }],
                [{ keys: ['declaredLength'], label: 'Declared Length' }],
                [{ keys: ['declaredWidth'], label: 'Declared Width' }],
                [{ keys: ['declaredHeight'], label: 'Declared Height' }],
                [{ keys: ['auditedLength', 'L'], label: 'Audited Length' }],
                [{ keys: ['auditedWidth', 'W'], label: 'Audited Width' }],
                [{ keys: ['auditedHeight', 'H'], label: 'Audited Height' }],
                [{ keys: ['auditedVolumetricWeight', 'audited_volumetric_weight'], label: 'Audited Volumetric Weight' }],
                [{ keys: ['auditedChargeableWeight', 'audited_chargeable_weight'], label: 'Audited Chargeable Weight' }],
                [{ keys: ['clientPaidWeight'], label: 'Client Paid Weight' }],
                [{ keys: ['containsLiquid'], label: 'Contains Liquid' }],
                [{ keys: ['containsBattery'], label: 'Contains Battery' }],
                [{ keys: ['itemCondition'], label: 'Item Condition' }],
                [{ keys: ['isCommercialPackaging'], label: 'Commercial Packaging' }],
                [{ keys: ['isUnderdeclared'], label: 'Underdeclared' }],
                [{ keys: ['referenceSource', 'refSource'], label: 'Reference Source' }],
                [{ keys: ['sessionId'], label: 'Session ID' }],
                [{ keys: ['hid'], label: 'Remarks' }],
                [{ keys: ['dateTime', 'time'], label: 'Date and Time' }]
            ];
        }

        function getDuplicateFieldValue(record, definition) {
            if (!record) {
                return null;
            }
            var keys = definition.keys || [];
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (record[key] !== undefined && record[key] !== null && record[key] !== '') {
                    return record[key];
                }
            }
            return keys.length > 0 ? record[keys[0]] : null;
        }

        function normalizeDuplicateValue(value, definition) {
            if (value === undefined || value === null || value === '') {
                return null;
            }

            var decimalFieldsToRound = {
                auditedLength: true,
                auditedWidth: true,
                auditedHeight: true
            };

            if (definition && definition.keys && definition.keys.length) {
                var primaryKey = definition.keys[0];
                if (decimalFieldsToRound[primaryKey]) {
                    var numericValue = Number(value);
                    if (!Number.isNaN(numericValue)) {
                        return numericValue.toFixed(2);
                    }
                }
            }

            return value;
        }

        function areDuplicateValuesEqual(left, right, definition) {
            return JSON.stringify(normalizeDuplicateValue(left, definition)) === JSON.stringify(normalizeDuplicateValue(right, definition));
        }

        function getDuplicateDifferences(oldRecord, newRecord) {
            return getDuplicateFieldDefinitions().filter(function(definition) {
                var field = definition[0];
                return !areDuplicateValuesEqual(
                    getDuplicateFieldValue(oldRecord, field),
                    getDuplicateFieldValue(newRecord, field),
                    field
                );
            }).map(function(definition) {
                return definition[0];
            });
        }

        function buildDuplicateComparisonHtml(record, fields) {
            if (!record) {
                return '<p class="text-muted text-center">No data</p>';
            }
            if (!fields || !fields.length) {
                return '<p class="text-muted text-center">No different fields</p>';
            }

            var html = '<table class="table table-bordered table-condensed">';
            fields.forEach(function(field) {
                var value = getDuplicateFieldValue(record, field);
                html += '<tr>' +
                    '<th style="width:45%;">' + field.label + '</th>' +
                    '<td>' + formatDuplicateValue(value) + '</td>' +
                    '</tr>';
            });
            html += '</table>';
            return html;
        }

        function formatDuplicateValue(value) {
            if (value === null || value === undefined || value === '') {
                return '<em>null</em>';
            }
            if (typeof value === 'boolean') {
                return value ? 'Yes' : 'No';
            }
            if (Array.isArray(value) || typeof value === 'object') {
                return $('<div/>').text(JSON.stringify(value)).html();
            }
            return $('<div/>').text(String(value)).html();
        }

        function updateDuplicateModalTitle(trackingNumber) {
            $('#duplicateSessionPackageModalTitle').text('Duplicate ' + (trackingNumber || 'session package'));
        }

        function updateDuplicateIdentityMessage(hasDifferences) {
            if (hasDifferences) {
                $('#duplicateIdentityMessage').hide().text('');
            } else {
                $('#duplicateIdentityMessage').text('Both records are identical, which would you like to keep?').show();
            }
        }

        function openDuplicateResolutionModal(trackingNumber) {
            pendingDuplicateTrackingNumber = trackingNumber;
            fetch('/scan-session/session/duplicate/' + encodeURIComponent(trackingNumber), {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'Accept': 'application/json'
                }
            }).then(function(response) {
                if (!response.ok) {
                    throw new Error('Unable to load duplicate comparison');
                }
                return response.json();
            }).then(function(payload) {
                var oldRecord = payload.oldRecord || null;
                var newRecord = payload.newRecord || null;
                var fieldsToShow = getDuplicateDifferences(oldRecord, newRecord);
                updateDuplicateModalTitle((payload && payload.trackingNumber) || trackingNumber);
                updateDuplicateIdentityMessage(fieldsToShow.length > 0);
                $('#duplicateOldRecord').html(buildDuplicateComparisonHtml(oldRecord, fieldsToShow));
                $('#duplicateNewRecord').html(buildDuplicateComparisonHtml(newRecord, fieldsToShow));
                $('input[name="duplicateSelection"][value="new"]').prop('checked', true);
                $('input[name="duplicateSelection"][value="old"]').prop('checked', false);
                setDuplicateResolutionLoading(false);
                $('#duplicateSessionPackageModal').modal({backdrop:'static', keyboard:false});
                $('#duplicateSessionPackageModal').modal('show');
            }).catch(function(error) {
                console.error('[scan-session-sse] failed to open duplicate modal', error);
            });
        }

        function setDuplicateResolutionLoading(isLoading) {
            duplicateResolutionInProgress = isLoading;
            $('#duplicateContinueButton')
                .prop('disabled', isLoading)
                .text(isLoading ? 'Resolving...' : 'Continue');
            $('input[name="duplicateSelection"]').prop('disabled', isLoading);
            $('#duplicateResolutionOverlay').css('display', isLoading ? 'flex' : 'none');
        }

        function resolveDuplicateSelection() {
            var selected = $('input[name="duplicateSelection"]:checked').val();
            if (!selected || !pendingDuplicateTrackingNumber) {
                alert('Please select which record to keep first.');
                return;
            }
            if (duplicateResolutionInProgress) {
                return;
            }

            setDuplicateResolutionLoading(true);

            fetch('/scan-session/session/duplicate/resolve', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    [header]: token
                },
                body: JSON.stringify({
                    trackingNumber: pendingDuplicateTrackingNumber,
                    selectedRecord: selected
                })
            }).then(function(response) {
                if (!response.ok) {
                    throw new Error('Unable to resolve duplicate');
                }
                return response.json();
            }).then(function() {
                $('#duplicateSessionPackageModal').modal('hide');
                pendingDuplicateTrackingNumber = null;
                debounceScanSessionRefresh();
            }).catch(function(error) {
                console.error('[scan-session-sse] failed to resolve duplicate', error);
                alert('Unable to resolve duplicate. Please try again.');
            }).finally(function() {
                setDuplicateResolutionLoading(false);
            });
        }

        $(document).on('click', '#duplicateContinueButton', function() {
            resolveDuplicateSelection();
        });

        function doPostCall(){
            tableFilters.length = 0;
            var normalizedFromDate = $('#from_date').val();
            var normalizedToDate = $('#to_date').val();
            var normalizedHub = $('#search_hub').val();
            if(normalizedHub == undefined){
                normalizedHub = $('#default_hub').val();
            }
            var normalizedTrackingNo = $('#search-tracking_no').val();

            if (normalizedFromDate !== "") {
                tableFilters.push(JSON.parse('{"field": "dateTime", "type":">=", "value":"'+ normalizedFromDate+ '"}'));
            }
            if (normalizedToDate !== "") {
                tableFilters.push(JSON.parse('{"field": "dateTime", "type":"<=", "value":"'+ normalizedToDate+ '"}'));
            }
            if (normalizedHub !== "") {
                tableFilters.push(JSON.parse('{"field": "hub", "type":"=", "value":"'+ normalizedHub+ '"}'));
            }
            if (normalizedTrackingNo !== "") {
                tableFilters.push(JSON.parse('{"field": "trackingNumber", "type":"=", "value":"'+ normalizedTrackingNo+ '"}'));
            }

            table.setData();
            table.setFilter(tableFilters);
            syncEmptyTableState();
            $('.searchloader').hide();
        }

        function getHubImageHtml(imgName) {
            return '<img src="images/hubs/' + imgName + '.png" width="35" height="35"/>';
        }

        function getConditionIcons(rowData) {
            var isUnderdeclared = rowData.isUnderdeclared;
            var containsBattery = rowData.containsBattery;
            var containsLiquid = rowData.containsLiquid;
            var isCommercialPackaging = rowData.isCommercialPackaging;
            var itemConditionValue = rowData.itemCondition;
            var isUsed = itemConditionValue != null ? itemConditionValue.toString().toLowerCase() === 'used' : false;

            function conditionIcon(src, altText, tooltipText) {
                return '' +
                    '<span class="condition-indicator" data-condition-tooltip="' + tooltipText.replace(/"/g, '&quot;') + '">' +
                        '<img src="' + src + '" alt="' + altText + '">' +
                    '</span>';
            }

            return '' +
                '<div class="condition-indicators">' +
                    conditionIcon(
                        'images/conditions/scale_' + (isUnderdeclared === true ? 'on' : 'off') + '.png',
                        'declared weight',
                        'Declared weight - ' + (isUnderdeclared === true ? 'under' : 'ok')
                    ) +
                    conditionIcon(
                        'images/conditions/new_' + (isUsed ? 'on' : 'off') + '.png',
                        'item',
                        'Item condition - ' + (isUsed ? 'used' : 'new')
                    ) +
                    conditionIcon(
                        'images/conditions/liquid_' + (containsLiquid === true ? 'on' : 'off') + '.png',
                        'liquid',
                        'Contains liquid - ' + (containsLiquid === true ? 'yes' : 'no')
                    ) +
                    conditionIcon(
                        'images/conditions/battery_' + (containsBattery === true ? 'on' : 'off') + '.png',
                        'battery',
                        'Contains battery - ' + (containsBattery === true ? 'yes' : 'no')
                    ) +
                    conditionIcon(
                        'images/conditions/commercial_' + (isCommercialPackaging === false ? 'on' : 'off') + '.png',
                        'commercial packaging',
                        'Commercial packaging - ' + (isCommercialPackaging === false ? 'no' : 'yes')
                    ) +
                '</div>';
        }

        function getStatusClass(status) {
            var normalizedStatus = (status || '').toString().toUpperCase();
            if (normalizedStatus === 'PROCEED') {
                return 'scan-session-status scan-session-status-proceed';
            }
            if (normalizedStatus === 'ON HOLD') {
                return 'scan-session-status scan-session-status-hold';
            }
            if (normalizedStatus === 'UNKNOWN') {
                return 'scan-session-status scan-session-status-unknown';
            }
            return 'scan-session-status';
        }

        function getStatusTextClass(status) {
            var normalizedStatus = (status || '').toString().toUpperCase();
            if (normalizedStatus === 'PROCEED') {
                return 'status-text status-text-proceed';
            }
            if (normalizedStatus === 'ON HOLD') {
                return 'status-text status-text-hold';
            }
            if (normalizedStatus === 'UNKNOWN') {
                return 'status-text status-text-unknown';
            }
            return 'status-text';
        }

        function statusTextFormatter(cell) {
            var value = cell.getValue();
            var safeValue = value == null || value === '' ? '-' : value;
            return '<span class="' + getStatusTextClass(value) + '">' + safeValue + '</span>';
        }

        function getStatusEmoji(status) {
            var normalizedStatus = (status || '').toString().toUpperCase();
            if (normalizedStatus === 'PROCEED') {
                return '😄';
            }
            if (normalizedStatus === 'ON HOLD') {
                return '😓';
            }
            if (normalizedStatus === 'UNKNOWN') {
                return '😐';
            }
            return '';
        }

        function renderLatestSummary(rowData) {
            var summaryBlock = document.getElementById('scan-session-latest-summary');
            if (!summaryBlock) {
                return;
            }

            if (!rowData) {
                summaryBlock.innerHTML = '' +
                    '<div class="scan-session-summary-header">' +
                        '<div class="scan-session-summary-hub">' + getHubImageHtml('HQ') + '</div>' +
                        '<div class="scan-session-summary-shipment">-</div>' +
                    '</div>' +
                    '<div class="scan-session-summary-tracking"><span class="scan-session-summary-emoji"></span>-</div>' +
                    '<div class="scan-session-summary-mode">(-)</div>' +
                    '<div class="scan-session-status">-</div>' +
                    '<div class="scan-session-summary-conditions">' + getConditionIcons({}) + '</div>';
                return;
            }

            summaryBlock.innerHTML = '' +
                '<div class="scan-session-summary-header">' +
                    '<div class="scan-session-summary-hub">' + getHubImageHtml(rowData.hub) + '</div>' +
                    '<div class="scan-session-summary-shipment">' + (rowData.shipmentId || '-') + '</div>' +
                '</div>' +
                '<div class="scan-session-summary-tracking"><span class="scan-session-summary-emoji">' + getStatusEmoji(rowData.status) + '</span>' + (rowData.code || '-') + '</div>' +
                '<div class="scan-session-summary-mode">(' + ((rowData.shippingMode || '-').toString()) + ')</div>' +
                '<div class="' + getStatusClass(rowData.status) + '">' + (rowData.status || '-') + '</div>' +
                '<div class="scan-session-summary-conditions">' + getConditionIcons(rowData) + '</div>';
        }

        function conditionsFormatter(cell){
            var rowData = cell.getRow().getData();
            var isUnderdeclared = rowData.isUnderdeclared;
            var containsBattery = rowData.containsBattery;
            var containsLiquid = rowData.containsLiquid;
            var isCommercialPackaging = rowData.isCommercialPackaging;
            var itemConditionValue = rowData.itemCondition;
            var isUsed = itemConditionValue != null ? itemConditionValue.toString().toLowerCase() === 'used' : false;

            function conditionIcon(src, altText, tooltipText) {
                return '' +
                    '<span class="condition-indicator" data-condition-tooltip="' + tooltipText.replace(/"/g, '&quot;') + '">' +
                        '<img src="' + src + '" alt="' + altText + '">' +
                    '</span>';
            }

            return '' +
                '<div class="condition-indicators">' +
                    conditionIcon(
                        'images/conditions/scale_' + (isUnderdeclared === true ? 'on' : 'off') + '.png',
                        'declared weight',
                        'Declared weight - ' + (isUnderdeclared === true ? 'under' : 'ok')
                    ) +
                    conditionIcon(
                        'images/conditions/new_' + (isUsed ? 'on' : 'off') + '.png',
                        'item',
                        'Item condition - ' + (isUsed ? 'used' : 'new')
                    ) +
                    conditionIcon(
                        'images/conditions/liquid_' + (containsLiquid === true ? 'on' : 'off') + '.png',
                        'liquid',
                        'Contains liquid - ' + (containsLiquid === true ? 'yes' : 'no')
                    ) +
                    conditionIcon(
                        'images/conditions/battery_' + (containsBattery === true ? 'on' : 'off') + '.png',
                        'battery',
                        'Contains battery - ' + (containsBattery === true ? 'yes' : 'no')
                    ) +
                    conditionIcon(
                        'images/conditions/commercial_' + (isCommercialPackaging === false ? 'on' : 'off') + '.png',
                        'commercial packaging',
                        'Commercial packaging - ' + (isCommercialPackaging === false ? 'no' : 'yes')
                    ) +
                '</div>';
        }
    </script>

<script>
    (function() {
        var tooltip = document.getElementById('condition-global-tooltip');

        function hideTooltip() {
            if (!tooltip) return;
            tooltip.style.display = 'none';
            tooltip.textContent = '';
            tooltip.classList.remove('tooltip-above');
        }

        function showTooltip(target) {
            if (!tooltip) return;
            var text = target.getAttribute('data-condition-tooltip');
            if (!text) return;

            tooltip.textContent = text;
            tooltip.style.display = 'block';

            var rect = target.getBoundingClientRect();
            var tooltipRect = tooltip.getBoundingClientRect();
            var left = rect.left + (rect.width / 2);
            var top = rect.bottom + 10;

            if (left - (tooltipRect.width / 2) < 8) {
                left = (tooltipRect.width / 2) + 8;
            }
            if (left + (tooltipRect.width / 2) > window.innerWidth - 8) {
                left = window.innerWidth - (tooltipRect.width / 2) - 8;
            }
            if (top + tooltipRect.height > window.innerHeight - 8) {
                top = rect.top - tooltipRect.height - 10;
                tooltip.classList.add('tooltip-above');
            } else {
                tooltip.classList.remove('tooltip-above');
            }

            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        document.addEventListener('mouseover', function(event) {
            var target = event.target.closest('.condition-indicator[data-condition-tooltip]');
            if (target) {
                showTooltip(target);
            }
        });

        document.addEventListener('mouseout', function(event) {
            var target = event.target.closest('.condition-indicator[data-condition-tooltip]');
            if (target) {
                hideTooltip();
            }
        });

        document.addEventListener('scroll', hideTooltip, true);
        window.addEventListener('resize', hideTooltip);
    })();
</script>
