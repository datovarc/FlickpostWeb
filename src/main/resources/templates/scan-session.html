<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="utf-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan Session | Flickpost</title>
    <meta name="description" content="Flickpost is a dynamic e-commerce solutions provider, presenting connections to 200+ countries around the world. Flickpost specializes in cross-border solutions for international shipments – whether a few grams or large parcels. Our objective is to assist e-commerce sellers and SMEs save time and reduce shipping costs, where they can send anything to anywhere affordably and hassle-free.">
    <link rel="shortcut icon" href="icons/favicon32x32-1.jpg">
    <link href="css/app.css" rel="stylesheet">
    <link href="css/themify-icons.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <link href="https://unpkg.com/tabulator-tables@4.9.3/dist/css/semantic-ui/tabulator_semantic-ui.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@4.9.3/dist/js/tabulator.js"></script>
    <script src="js/scan-session-toggle.js"></script>

    <script th:inline="javascript">
        var token = $("meta[name='_csrf']").attr("content");
        var searching = false;
        var tableFilters = [];
        var table = null;

        function executeUploadReport() {
            $("body").addClass("loading");
            $('#modal-hide-thing').modal('toggle');
            $("#uploadReportForm").submit();
        }


        $(document).ready(function(){
            $(window).keydown(function(event){
                if(event.keyCode == 13) {
                    event.preventDefault();
                    return false;
                }
            });

            $('#searchButton').on('click',function(){
                $('.searchform').fadeToggle();
                if(!searching) {
                    $("#searchButton").html("<i class=\"ti ti-eraser\"></i> Reset");
                    searching = true;
                } else {
                    $("#searchButton").html("<i class=\"ti ti-search\"></i> Search");
                    $('#from_date').val("");
                    $('#to_date').val("");
                    $('#search_hub').val("");
                    $('#search-tracking_no').val("");
                    if (table) {
                        table.clearFilter();
                        table.setData();
                        syncEmptyTableState();
                    }
                    searching = false;
                }
            });

            $('#search-form').on('keyup change', 'input, select', function(){
                doPostCall();
            });

            table = new Tabulator("#packages-table", {
                index:"Tracking Number",
                resizableColumns:"header",
                layout: "fitDataStretch",
                ajaxURL: "/scan-session/data",
                ajaxConfig: {
                    method: "POST",
                    headers:{
                        'X-CSRF-Token': token,
                    }
                },
                ajaxContentType:"json",
                ajaxFiltering: true,
                ajaxResponse:function(url, params, response){
                    renderLatestSummary(response && response.length > 0 ? response[0] : null);
                    return response;
                },
                placeholder:"<div class=\"scan-session-empty-placeholder\"></div>",
                rowClick:function(e, row){
                    renderLatestSummary(row.getData());
                },
                columns:[
                    {formatter:"rowSelection", titleFormatter:"rowSelection", width:60, hozAlign:"center", vertAlign:"middle", headerSort:false, frozen:true, cellClick:function(e, cell){
                            cell.getRow().toggleSelect();
                        }},
                    {title:"Hub", field:"hub", width:90, hozAlign:"center", vertAlign:"middle", frozen:true, formatter:function (cell) {
                        var imgName = cell.getValue();
                        return getHubImageHtml(imgName);
                    }},
                    {title:"Tracking Number", field:"code", width:180, hozAlign:"center", vertAlign:"middle", frozen:true},
                    {title:"Shipment ID", field:"shipmentId", width:180, hozAlign:"center", vertAlign:"middle"},
                    {title:"Status", field:"status", width:140, hozAlign:"center", vertAlign:"middle"},
                    {title:"Audited Length (cm)", field:"L", width:150, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}},
                    {title:"Audited Width (cm)", field:"W", width:150, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}},
                    {title:"Audited Height (cm)", field:"H", width:150, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}},
                    {title:"Audited Weight (kg)", field:"weight", width:150, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}},
                    {title:"Declared Length (cm)", field:"declaredLength", width:160, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}},
                    {title:"Declared Width (cm)", field:"declaredWidth", width:160, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}},
                    {title:"Declared Height (cm)", field:"declaredHeight", width:160, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}},
                    {title:"Declared Weight (kg)", field:"declaredWeight", width:160, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}},
                    {title:"Client Paid Height (cm)", field:"clientPaidHeight", width:180, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}},
                    {title:"Destination Country", field:"destinationCountry", width:180, hozAlign:"center", vertAlign:"middle"},
                    {title:"Conditions", field:"itemCondition", width:170, hozAlign:"center", vertAlign:"middle", formatter:conditionsFormatter},
                    {title:"Shipping Mode", field:"shippingMode", width:150, hozAlign:"center", vertAlign:"middle"},
                    {title:"Audited Volumetric Weight (kg)", field:"audited_volumetric_weight", width:190, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{thousand:""}},
                    {title:"Chargeable Weight (kg)", field:"chargeable_weight", width:170, hozAlign:"center", vertAlign:"middle", formatter:"money", formatterParams:{precision:1, thousand:""}},
                    {title:"Date and Time", field:"time", width:180, hozAlign:"center", vertAlign:"middle"},
                    {title:"Remarks", field:"hid", width:180, hozAlign:"center", vertAlign:"middle"}
                ]
            });

            table.redraw(true);

            function syncEmptyTableState() {
                var emptyRow = document.getElementById("scan-session-empty-row");
                if (!emptyRow || !table) {
                    return;
                }
                emptyRow.style.display = table.getDataCount() === 0 ? "block" : "none";
            }

            syncEmptyTableState();
            renderLatestSummary(null);
            table.on("dataLoaded", function(){
                syncEmptyTableState();
            });
            table.on("renderComplete", function(){
                syncEmptyTableState();
            });
        });

        function doPostCall(){
            tableFilters.length = 0;
            var normalizedFromDate = $('#from_date').val();
            var normalizedToDate = $('#to_date').val();
            var normalizedHub = $('#search_hub').val();
            if(normalizedHub == undefined){
                normalizedHub = $('#default_hub').val();
            }
            var normalizedTrackingNo = $('#search-tracking_no').val();

            if (normalizedFromDate !== "") {
                tableFilters.push(JSON.parse('{"field": "dateTime", "type":">=", "value":"'+ normalizedFromDate+ '"}'));
            }
            if (normalizedToDate !== "") {
                tableFilters.push(JSON.parse('{"field": "dateTime", "type":"<=", "value":"'+ normalizedToDate+ '"}'));
            }
            if (normalizedHub !== "") {
                tableFilters.push(JSON.parse('{"field": "hub", "type":"=", "value":"'+ normalizedHub+ '"}'));
            }
            if (normalizedTrackingNo !== "") {
                tableFilters.push(JSON.parse('{"field": "trackingNumber", "type":"=", "value":"'+ normalizedTrackingNo+ '"}'));
            }

            table.setData();
            table.setFilter(tableFilters);
            syncEmptyTableState();
            $('.searchloader').hide();
        }

        function getHubImageHtml(imgName) {
            return '<img src="images/hubs/' + imgName + '.png" width="35" height="35"/>';
        }

        function getConditionIcons(rowData) {
            var isUnderdeclared = rowData.isUnderdeclared;
            var containsBattery = rowData.containsBattery;
            var containsLiquid = rowData.containsLiquid;
            var isCommercialPackaging = rowData.isCommercialPackaging;
            var itemConditionValue = rowData.itemCondition;
            var isNew = itemConditionValue != null ? itemConditionValue.toString().toLowerCase() === 'new' : null;

            function conditionIcon(src, altText, tooltipText) {
                return '' +
                    '<span class="condition-indicator" data-condition-tooltip="' + tooltipText.replace(/"/g, '&quot;') + '">' +
                        '<img src="' + src + '" alt="' + altText + '">' +
                    '</span>';
            }

            return '' +
                '<div class="condition-indicators">' +
                    conditionIcon(
                        'images/conditions/new_' + (isNew ? 'true' : 'false') + '.png',
                        'item',
                        'Item condition - ' + (isNew ? 'new' : 'used')
                    ) +
                    conditionIcon(
                        'images/conditions/liquid_' + (containsLiquid ? 'true' : 'false') + '.png',
                        'liquid',
                        'Contains liquid - ' + (containsLiquid ? 'yes' : 'no')
                    ) +
                    conditionIcon(
                        'images/conditions/battery_' + (containsBattery ? 'true' : 'false') + '.png',
                        'battery',
                        'Contains battery - ' + (containsBattery ? 'yes' : 'no')
                    ) +
                    conditionIcon(
                        'images/conditions/commercial_' + (isCommercialPackaging ? 'true' : 'false') + '.png',
                        'commercial packaging',
                        'Commercial packaging - ' + (isCommercialPackaging ? 'yes' : 'no')
                    ) +
                '</div>';
        }

        function getStatusClass(status) {
            var normalizedStatus = (status || '').toString().toUpperCase();
            if (normalizedStatus === 'PROCEED') {
                return 'scan-session-status scan-session-status-proceed';
            }
            if (normalizedStatus === 'ON-HOLD') {
                return 'scan-session-status scan-session-status-hold';
            }
            return 'scan-session-status';
        }

        function renderLatestSummary(rowData) {
            var summaryBlock = document.getElementById('scan-session-latest-summary');
            if (!summaryBlock) {
                return;
            }

            if (!rowData) {
                summaryBlock.innerHTML = '' +
                    '<div class="scan-session-summary-header">' +
                        '<div class="scan-session-summary-hub">' + getHubImageHtml('HQ') + '</div>' +
                        '<div class="scan-session-summary-shipment">Shipment ID: -</div>' +
                    '</div>' +
                    '<div class="scan-session-summary-tracking">-</div>' +
                    '<div class="scan-session-summary-mode">(-)</div>' +
                    '<div class="scan-session-status">-</div>' +
                    '<div class="scan-session-summary-conditions">' + getConditionIcons({}) + '</div>';
                return;
            }

            summaryBlock.innerHTML = '' +
                '<div class="scan-session-summary-header">' +
                    '<div class="scan-session-summary-hub">' + getHubImageHtml(rowData.hub) + '</div>' +
                    '<div class="scan-session-summary-shipment">Shipment ID: ' + (rowData.shipmentId || '-') + '</div>' +
                '</div>' +
                '<div class="scan-session-summary-tracking">' + (rowData.code || '-') + '</div>' +
                '<div class="scan-session-summary-mode">(' + ((rowData.shippingMode || '-').toString()) + ')</div>' +
                '<div class="' + getStatusClass(rowData.status) + '">' + (rowData.status || '-') + '</div>' +
                '<div class="scan-session-summary-conditions">' + getConditionIcons(rowData) + '</div>';
        }

        function conditionsFormatter(cell){
            var rowData = cell.getRow().getData();
            var isUnderdeclared = rowData.isUnderdeclared;
            var containsBattery = rowData.containsBattery;
            var containsLiquid = rowData.containsLiquid;
            var isCommercialPackaging = rowData.isCommercialPackaging;
            var itemConditionValue = rowData.itemCondition;
            var isNew = itemConditionValue != null ? itemConditionValue.toString().toLowerCase() === 'new' : null;

            function conditionIcon(src, altText, tooltipText) {
                return '' +
                    '<span class="condition-indicator" data-condition-tooltip="' + tooltipText.replace(/"/g, '&quot;') + '">' +
                        '<img src="' + src + '" alt="' + altText + '">' +
                    '</span>';
            }

            return '' +
                '<div class="condition-indicators">' +
                    conditionIcon(
                        'images/conditions/scale_' + (isUnderdeclared == null ? 'false' : (isUnderdeclared ? 'false' : 'true')) + '.png',
                        'declared weight',
                        'Declared weight - ' + (isUnderdeclared == null ? 'pending' : (isUnderdeclared ? 'under' : 'ok'))
                    ) +
                    conditionIcon(
                        'images/conditions/new_' + (isNew == null ? 'false' : (isNew ? 'true' : 'false')) + '.png',
                        'item',
                        'Item condition - ' + (isNew == null ? 'pending' : (isNew ? 'new' : 'used'))
                    ) +
                    conditionIcon(
                        'images/conditions/liquid_' + (containsLiquid == null ? 'true' : (containsLiquid ? 'true' : 'false')) + '.png',
                        'liquid',
                        'Contains liquid - ' + (containsLiquid == null ? 'pending' : (containsLiquid ? 'yes' : 'no'))
                    ) +
                    conditionIcon(
                        'images/conditions/battery_' + (containsBattery == null ? 'true' : (containsBattery ? 'true' : 'false')) + '.png',
                        'battery',
                        'Contains battery - ' + (containsBattery == null ? 'pending' : (containsBattery ? 'yes' : 'no'))
                    ) +
                    conditionIcon(
                        'images/conditions/commercial_' + (isCommercialPackaging == null ? 'false' : (isCommercialPackaging ? 'true' : 'false')) + '.png',
                        'commercial packaging',
                        'Commercial packaging - ' + (isCommercialPackaging == null ? 'pending' : (isCommercialPackaging ? 'yes' : 'no'))
                    ) +
                '</div>';
        }
    </script>
</head>

<script>
    (function() {
        var tooltip = document.getElementById('condition-global-tooltip');

        function hideTooltip() {
            if (!tooltip) return;
            tooltip.style.display = 'none';
            tooltip.textContent = '';
        }

        function showTooltip(target) {
            if (!tooltip) return;
            var text = target.getAttribute('data-condition-tooltip');
            if (!text) return;

            tooltip.textContent = text;
            tooltip.style.display = 'block';

            var rect = target.getBoundingClientRect();
            var tooltipRect = tooltip.getBoundingClientRect();
            var left = rect.left + (rect.width / 2);
            var top = rect.bottom + 10;

            if (left - (tooltipRect.width / 2) < 8) {
                left = (tooltipRect.width / 2) + 8;
            }
            if (left + (tooltipRect.width / 2) > window.innerWidth - 8) {
                left = window.innerWidth - (tooltipRect.width / 2) - 8;
            }
            if (top + tooltipRect.height > window.innerHeight - 8) {
                top = rect.top - tooltipRect.height - 10;
            }

            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        document.addEventListener('mouseover', function(event) {
            var target = event.target.closest('.condition-indicator[data-condition-tooltip]');
            if (target) {
                showTooltip(target);
            }
        });

        document.addEventListener('mouseout', function(event) {
            var target = event.target.closest('.condition-indicator[data-condition-tooltip]');
            if (target) {
                hideTooltip();
            }
        });

        document.addEventListener('scroll', hideTooltip, true);
        window.addEventListener('resize', hideTooltip);
    })();
</script>
